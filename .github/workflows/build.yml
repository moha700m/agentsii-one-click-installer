name: Build & test Windows

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  windows:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install build deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-build.txt

      - name: Unit + integration tests (Windows)
        run: python -m pytest -q tests

      - name: Build auth helper (agentsii-auth.exe)
        shell: pwsh
        run: |
          $root = (Get-Location).Path
          pyinstaller --noconfirm --clean --onefile --windowed --name agentsii-auth `
            --paths "$root/src" --icon "$root/assets/icon.ico" --version-file "$root/packaging/version_info.txt" `
            --workpath build/auth --specpath build/auth auth_launcher.py

      - name: Build portable (AgentsiiPortable.exe)
        shell: pwsh
        run: |
          $root = (Get-Location).Path
          pyinstaller --noconfirm --clean --onefile --windowed --name AgentsiiPortable `
            --paths "$root/src" --icon "$root/assets/icon.ico" --version-file "$root/packaging/version_info.txt" `
            --add-data "$root/assets;assets" --add-binary "$root/dist/agentsii-auth.exe;helper" `
            --workpath build/portable --specpath build/portable launcher.py

      - name: Build app folder (AgentsiiInstaller.exe)
        shell: pwsh
        run: |
          $root = (Get-Location).Path
          pyinstaller --noconfirm --clean --onedir --windowed --name AgentsiiInstaller `
            --paths "$root/src" --icon "$root/assets/icon.ico" --version-file "$root/packaging/version_info.txt" `
            --add-data "$root/assets;assets" --add-binary "$root/dist/agentsii-auth.exe;helper" `
            --workpath build/onedir --specpath build/onedir launcher.py

      - name: Build Windows installer (AgentsiiSetup.exe)
        shell: pwsh
        run: |
          $iscc = Get-Command iscc -ErrorAction SilentlyContinue
          if (-not $iscc) {
            $cand = @("${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe", "$env:ProgramFiles\Inno Setup 6\ISCC.exe") | Where-Object { Test-Path $_ } | Select-Object -First 1
            if (-not $cand) { choco install innosetup -y --no-progress | Out-Null; $cand = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
            $iscc = $cand
          } else { $iscc = $iscc.Source }
          & $iscc installer/agentsii.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Install real Codex CLI
        run: npm install -g @openai/codex

      - name: End-to-end test of built EXEs (real Credential Manager + real Codex)
        run: python ci/e2e_windows.py

      - name: Real-Windows UI screenshots from the EXE
        if: always()
        shell: pwsh
        run: |
          Start-Process -FilePath dist/AgentsiiPortable.exe -ArgumentList "--screenshots", "$PWD/screenshots" -Wait
          Get-ChildItem screenshots

      - name: Package
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item dist/AgentsiiPortable.exe release/ -ErrorAction SilentlyContinue
          Copy-Item dist/AgentsiiSetup.exe release/ -ErrorAction SilentlyContinue
          Copy-Item docs/UserGuide-AR.html release/ -ErrorAction SilentlyContinue
          if (Test-Path dist/AgentsiiInstaller) { Compress-Archive -Path dist/AgentsiiInstaller -DestinationPath release/AgentsiiInstaller-app.zip -Force }
          Get-ChildItem release | ForEach-Object { "{0}  {1:N1} MB  {2}" -f $_.Name, ($_.Length/1MB), (Get-FileHash $_.FullName -Algorithm SHA256).Hash } | Tee-Object release/SHA256.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agentsii-${{ matrix.os }}
          path: |
            release/
            e2e-out/
            screenshots/
          if-no-files-found: warn
